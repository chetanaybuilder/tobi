[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tobi"
version = "1.0.0"
description = "Tobi AI Assistant"
authors = [{name = "chetanaybuilder"}]
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
